version: '3.8'

# Definicion de redes, aislamos frontend de db
networks:
  frontend_net:
  backend_net:

# Volumenes, persistencia para la base de datos
volumes:
  db_data:

services:
  # Base de datos, postgres
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
      # init.sql solo lectura 
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache, Redis
  cache:
    image: redis:7-alpine
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio Catalog
  catalog:
    build: ./catalog
    env_file:
      - .env
    networks:
      - frontend_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy

  # Servicio Orders
  orders:
    build: ./orders
    env_file:
      - .env
    networks:
      - frontend_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  # Servicio Worker
  worker:
    build: ./worker
    env_file:
      - .env
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  # Servicio Frontend
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT}:8080"
    networks:
      - frontend_net
    depends_on:
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy
networks:
  frontend_net:
  backend_net:

volumes:
  db_data:
  cache_data:

services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cache_data:/data
    networks:
      - backend_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  catalog:
    build: ./catalog
    restart: always
    env_file:
      - .env
    environment:
      - CURRENCY=MXN
    networks:
      - frontend_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
        restart: true
  

  orders:
    build: ./orders
    restart: always
    env_file:
      - .env
    networks:
      - frontend_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
        restart: true

  worker:
    build: ./worker
    restart: always
    env_file:
      - .env
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
        restart: true

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:8080"
    networks:
      - frontend_net
    depends_on:
      catalog:
        condition: service_healthy
        restart: true
      orders:
        condition: service_healthy
        restart: true